name: Refine shared Apps & Games Info standard

on:
  push:
    paths:
      - '.github/workflows/fix-info-standard.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refine shared module
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('assets/apps-games-info-standard.js')
          s = p.read_text(encoding='utf-8')
          old = '''  function getLanguage() {
            const raw = String(
              document.querySelector('#languageSelect, #language, #langSelect, select[id*="lang" i], select[name*="lang" i]')?.value ||
              document.documentElement.lang || navigator.language || 'en'
            ).toLowerCase();
            if (raw.startsWith('hr') || raw.includes('hrvat')) return 'hr';
            if (raw.startsWith('de') || raw.includes('deutsch')) return 'de';
            if (raw.startsWith('it') || raw.includes('ital')) return 'it';
            if (raw.startsWith('es') || raw.includes('espa')) return 'es';
            return 'en';
          }'''.replace('          ', '  ')
          new = '''  function getLanguage(context = document) {
            const contextText = String(context?.textContent || '').toLowerCase();
            if (/dobrovoljne donacije|donirati možete|kripto novčanik|podržite projekt/.test(contextText)) return 'hr';
            if (/freiwillige spenden|spenden sind möglich|krypto-wallet|projekt unterstützen/.test(contextText)) return 'de';
            if (/donazioni volontarie|puoi effettuare una donazione|portafogli crypto|sostieni il progetto/.test(contextText)) return 'it';
            if (/donaciones voluntarias|puedes realizar una donación|carteras de cripto|apoya el proyecto/.test(contextText)) return 'es';

            const raw = String(
              document.querySelector('#languageSelect, #language, #langSelect, select[id*="lang" i], select[name*="lang" i]')?.value ||
              document.documentElement.lang || navigator.language || 'en'
            ).toLowerCase();
            if (raw.startsWith('hr') || raw.includes('hrvat')) return 'hr';
            if (raw.startsWith('de') || raw.includes('deutsch')) return 'de';
            if (raw.startsWith('it') || raw.includes('ital')) return 'it';
            if (raw.startsWith('es') || raw.includes('espa')) return 'es';
            return 'en';
          }'''.replace('          ', '  ')
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace('    const lang = getLanguage();\n', '    const lang = getLanguage(root);\n', 1)
          s = s.replace("    const host = anchor.closest('[id*=\"content\" i],[class*=\"content\" i],.info-text,.modal-body') || anchor.parentElement?.parentElement || root;\n    host.insertAdjacentHTML('beforeend', markup(lang));", "    let host = anchor.closest('[id*=\"content\" i],[class*=\"content\" i],.info-text,.modal-body');\n    if (!host || !root.contains(host)) {\n      host = root.querySelector?.('[id*=\"content\" i],[class*=\"content\" i],.info-text,.modal-body,.modal-card') || root;\n    }\n    if (/payment-options|payment-grid|donation-options|donation-methods/.test(String(host.className || ''))) host = root;\n    host.insertAdjacentHTML('beforeend', markup(lang));", 1)
          s = s.replace("    const lang = getLanguage(), t = i18n[lang] || i18n.en;", "    const lang = getLanguage(button.closest('.ag-support-standard') || document), t = i18n[lang] || i18n.en;", 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check assets/apps-games-info-standard.js
      - name: Commit change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/apps-games-info-standard.js
          git commit -m "Refine shared Info language and placement"
          git push
