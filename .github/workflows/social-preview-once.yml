name: One-time social preview metadata update

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/social-preview-once.yml'

permissions:
  contents: write

jobs:
  update-social-previews:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update portal social preview metadata
        shell: python
        run: |
          from pathlib import Path
          import re

          social = {
              'index.html': 'apps-and-games-social.jpg',
              'digital-clock.html': 'digital-clock.jpg',
              'date-lotto-generator.html': 'date-lotto-generator.jpg',
              'emoji-copy-paste.html': 'emoji-copy-paste.jpg',
              'unit-converter.html': 'unit-converter.jpg',
              'crossword.html': 'crossword.jpg',
              'tetris.html': 'tetris.jpg',
              'ufo-invaders.html': 'ufo-invaders.jpg',
              'phoenix-arcade.html': 'phoenix-arcade.jpg',
              'neon-pacman.html': 'neon-pacman.jpg',
              'modern-snake.html': 'modern-snake.jpg',
          }

          def set_meta(text, key, value, url):
              pat = rf'(<meta\s+(?:property|name)="{re.escape(key)}"\s+content=")[^"]*("\s*/?>)'
              text, n = re.subn(pat, rf'\1{url}\2', text, count=1, flags=re.I)
              if n == 0:
                  text = text.replace('</head>', f'    <meta {"property" if key.startswith("og:") else "name"}="{key}" content="{url}">\n</head>', 1)
              return text

          for filename, image_name in social.items():
              p = Path(filename)
              if not p.exists():
                  raise SystemExit(f'Missing expected portal file: {filename}')
              text = p.read_text(encoding='utf-8')
              url = f'https://appsandgames.org/assets/social/{image_name}'
              text = set_meta(text, 'og:image', image_name, url)
              text = set_meta(text, 'twitter:image', image_name, url)
              p.write_text(text, encoding='utf-8')

          # Keep the main portal structured data visually aligned with social previews.
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              'https://appsandgames.org/assets/images/ufo-invaders.png': 'https://appsandgames.org/assets/social/ufo-invaders.jpg',
              'https://appsandgames.org/assets/images/phoenix-arcade-cover.png': 'https://appsandgames.org/assets/social/phoenix-arcade.jpg',
              'https://appsandgames.org/assets/images/emoji-copy-paste.svg': 'https://appsandgames.org/assets/social/emoji-copy-paste.jpg',
              'https://appsandgames.org/assets/images/unit-converter.svg': 'https://appsandgames.org/assets/social/unit-converter.jpg',
              'https://appsandgames.org/assets/images/neon-pacman-cover.svg': 'https://appsandgames.org/assets/social/neon-pacman.jpg',
              'https://appsandgames.org/assets/images/modern-snake-cover.svg': 'https://appsandgames.org/assets/social/modern-snake.jpg',
              'https://appsandgames.org/assets/images/crossword-cover.svg': 'https://appsandgames.org/assets/social/crossword.jpg',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')

          workflow = Path('.github/workflows/social-preview-once.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Commit social preview metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Use dedicated social preview images"
          git push
