name: Add Memory Game to portal

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-memory-game.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Memory Game integration
        run: python tools/add_memory_game.py

      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check memory-game-detail.js

      - name: Commit integrated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html script.js sitemap.xml memory-game.html memory-game-detail.js assets/images/memory-game-cover.svg
          git rm .github/workflows/add-memory-game.yml tools/add_memory_game.py
          git commit -m "Add Memory Game to Apps & Games portal"
          git push
