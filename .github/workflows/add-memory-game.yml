    function initialLanguage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (SUPPORTED.includes(saved)) return saved;
        const browser = (navigator.language || "en").slice(0, 2).toLowerCase();
        return SUPPORTED.includes(browser) ? browser : "en";
    }

    const select = document.getElementById("languageSelect");
    const themeToggle = document.getElementById("themeToggle");

    function applyLanguage(lang) {
        const c = copy[SUPPORTED.includes(lang) ? lang : "en"];
        document.documentElement.lang = SUPPORTED.includes(lang) ? lang : "en";
        if (select) select.value = document.documentElement.lang;
        localStorage.setItem(STORAGE_KEY, document.documentElement.lang);
        document.title = c.title;
        const meta = document.querySelector('meta[name="description"]');
        if (meta) meta.content = c.description;
        document.querySelector('[data-role="badge"]').textContent = c.badge;
        document.querySelector('[data-role="subtitle"]').textContent = c.subtitle;
        document.querySelector('[data-role="text"]').textContent = c.text;
        document.querySelector('[data-role="primary"]').textContent = c.primary;
        document.querySelector('[data-role="back"]').textContent = c.back;
        document.querySelector('[data-role="about"]').textContent = c.about;
        document.getElementById("detailInfo").innerHTML = c.info;
        document.querySelector('[data-nav="apps"]').textContent = c.navApps;
        document.querySelector('[data-nav="games"]').textContent = c.navGames;
        document.querySelector('[data-nav="info"]').textContent = c.navInfo;
        document.querySelector('[data-footer="home"]').textContent = c.home;
        document.querySelector('[data-footer="apps"]').textContent = c.navApps;
        document.querySelector('[data-footer="games"]').textContent = c.navGames;
        document.querySelector('[data-footer="privacy"]').textContent = c.privacy;
    }

    if (select) select.addEventListener("change", e => applyLanguage(e.target.value));

    function applyTheme(theme) {
        if (theme === "light") {
            document.documentElement.setAttribute("data-theme", "light");
            if (themeToggle) themeToggle.textContent = "🌙";
        } else {
            document.documentElement.removeAttribute("data-theme");
            if (themeToggle) themeToggle.textContent = "☀️";
        }
    }

    applyTheme(localStorage.getItem("theme") === "light" ? "light" : "dark");
    if (themeToggle) themeToggle.addEventListener("click", () => {
        const next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
        localStorage.setItem("theme", next);
        applyTheme(next);
    });

    const year = document.getElementById("currentYear");
    if (year) year.textContent = new Date().getFullYear();
    applyLanguage(initialLanguage());
})();'''
