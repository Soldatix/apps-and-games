<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Modern Snake</title>
  <desc id="desc">Modern Snake browser game cover with a glowing green snake on a blue grid, bonus food, hearts and a star.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9f3ff"/>
      <stop offset="1" stop-color="#8fd3f4"/>
    </linearGradient>
    <linearGradient id="snake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7dffc0"/>
      <stop offset="1" stop-color="#21bf79"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="54" height="54" patternUnits="userSpaceOnUse">
      <path d="M54 0H0V54" fill="none" stroke="#0b2940" stroke-opacity=".34" stroke-width="3"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <rect x="38" y="38" width="1124" height="599" rx="28" fill="url(#grid)" stroke="#0b2940" stroke-opacity=".32" stroke-width="4"/>

  <g filter="url(#glow)">
    <rect x="198" y="396" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="284" y="396" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="370" y="396" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="456" y="396" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="542" y="310" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="542" y="224" width="92" height="92" rx="26" fill="url(#snake)"/>
    <rect x="628" y="224" width="108" height="92" rx="30" fill="url(#snake)"/>
  </g>

  <circle cx="702" cy="252" r="9" fill="#07101d"/>
  <circle cx="702" cy="288" r="9" fill="#07101d"/>
  <path d="M742 270l38-22v44z" fill="#ffffff" opacity=".9"/>

  <g filter="url(#glow)">
    <circle cx="862" cy="270" r="30" fill="#ffd76a"/>
    <circle cx="852" cy="260" r="8" fill="#ffffff" opacity=".9"/>
    <circle cx="949" cy="410" r="37" fill="#ff607d"/>
    <text x="949" y="424" text-anchor="middle" font-size="48" font-family="Arial, sans-serif" fill="#fff">♥</text>
    <circle cx="1036" cy="326" r="37" fill="#4dc9ff"/>
    <text x="1036" y="340" text-anchor="middle" font-size="48" font-family="Arial, sans-serif" fill="#fff">★</text>
  </g>

  <rect x="76" y="78" width="552" height="132" rx="28" fill="#07101d" fill-opacity=".86"/>
  <text x="112" y="139" font-family="Arial, sans-serif" font-weight="800" font-size="34" letter-spacing="5" fill="#63f5a4">MODERN</text>
  <text x="108" y="190" font-family="Arial, sans-serif" font-weight="900" font-size="66" letter-spacing="2" fill="#ffffff">SNAKE</text>

  <rect x="790" y="538" width="320" height="62" rx="31" fill="#07101d" fill-opacity=".84"/>
  <text x="950" y="579" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="23" fill="#dff7ff">3 LIVES • BONUSES • MOUSE</text>
</svg>
