<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Apps &amp; Games Crossword</title>
  <desc id="desc">Stylized crossword grid on a dark blue gradient background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101936"/>
      <stop offset="0.65" stop-color="#142349"/>
      <stop offset="1" stop-color="#0d3951"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#071128" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="720" rx="44" fill="url(#bg)"/>
  <circle cx="1060" cy="80" r="245" fill="#54e8ff" opacity="0.08"/>
  <circle cx="1050" cy="660" r="210" fill="#2667ff" opacity="0.08"/>

  <g transform="translate(95 110)">
    <text x="0" y="0" fill="#54e8ff" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" letter-spacing="5">APPS&amp;GAMES</text>
    <text x="0" y="80" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="800">Crossword</text>
    <text x="0" y="132" fill="#c8d3ea" font-family="Arial, Helvetica, sans-serif" font-size="30">Create • Solve • Print • Share</text>
    <text x="0" y="190" fill="#9fb0cf" font-family="Arial, Helvetica, sans-serif" font-size="24">500 ready-made crosswords • 5 languages • 10 categories</text>
  </g>

  <g transform="translate(770 170) rotate(4)" filter="url(#shadow)">
    <g fill="#29425f" stroke="#45617c" stroke-width="3">
      <rect x="0" y="0" width="62" height="62" rx="8"/><rect x="68" y="0" width="62" height="62" rx="8"/><rect x="136" y="0" width="62" height="62" rx="8"/><rect x="204" y="0" width="62" height="62" rx="8"/><rect x="272" y="0" width="62" height="62" rx="8"/>
      <rect x="0" y="68" width="62" height="62" rx="8"/><rect x="68" y="68" width="62" height="62" rx="8"/><rect x="204" y="68" width="62" height="62" rx="8"/><rect x="272" y="68" width="62" height="62" rx="8"/>
      <rect x="0" y="136" width="62" height="62" rx="8"/><rect x="272" y="136" width="62" height="62" rx="8"/>
      <rect x="0" y="204" width="62" height="62" rx="8"/><rect x="68" y="204" width="62" height="62" rx="8"/><rect x="204" y="204" width="62" height="62" rx="8"/><rect x="272" y="204" width="62" height="62" rx="8"/>
      <rect x="0" y="272" width="62" height="62" rx="8"/><rect x="68" y="272" width="62" height="62" rx="8"/><rect x="204" y="272" width="62" height="62" rx="8"/><rect x="272" y="272" width="62" height="62" rx="8"/>
    </g>
    <g fill="#f8fbff" stroke="#ffffff" stroke-width="3">
      <rect x="136" y="68" width="62" height="62" rx="8"/>
      <rect x="68" y="136" width="62" height="62" rx="8"/>
      <rect x="136" y="136" width="62" height="62" rx="8"/>
      <rect x="204" y="136" width="62" height="62" rx="8"/>
      <rect x="136" y="204" width="62" height="62" rx="8"/>
      <rect x="136" y="272" width="62" height="62" rx="8"/>
      <rect x="136" y="340" width="62" height="62" rx="8"/>
    </g>
    <g fill="#142349" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="800" text-anchor="middle" dominant-baseline="central">
      <text x="167" y="99">C</text>
      <text x="99" y="167">W</text><text x="167" y="167">O</text><text x="235" y="167">R</text>
      <text x="167" y="235">D</text><text x="167" y="303">S</text><text x="167" y="371">!</text>
    </g>
  </g>
</svg>