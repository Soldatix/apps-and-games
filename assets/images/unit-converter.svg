<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Unit Converter</title>
  <desc id="desc">Modern preview for the Unit Converter web application.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071128"/>
      <stop offset="0.52" stop-color="#172b63"/>
      <stop offset="1" stop-color="#6d35c5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="28%" r="75%">
      <stop offset="0" stop-color="#48e5c2" stop-opacity=".28"/>
      <stop offset="1" stop-color="#48e5c2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#020611" flood-opacity=".45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="34" fill="url(#glow)"/>
  <circle cx="95" cy="90" r="9" fill="#48e5c2"/>
  <circle cx="1090" cy="520" r="13" fill="#8aa8ff" opacity=".85"/>
  <text x="600" y="105" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="800" letter-spacing="6" fill="#cbd6ff">FREE ONLINE APP</text>
  <text x="600" y="220" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="850" letter-spacing="-3" fill="#ffffff">Unit Converter</text>
  <text x="600" y="282" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#e4eaff">Convert measurements quickly and accurately</text>
  <g filter="url(#shadow)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <rect x="135" y="340" width="260" height="105" rx="22" fill="#0d1837" stroke="#48e5c2" stroke-width="3"/>
    <text x="265" y="385" text-anchor="middle" font-size="25" font-weight="700" fill="#aef7e8">10 kilometers</text>
    <text x="265" y="422" text-anchor="middle" font-size="20" fill="#ffffff" opacity=".8">LENGTH</text>
    <path d="M435 392h105" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
    <path d="M518 370l24 22-24 22" fill="none" stroke="#48e5c2" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="580" y="340" width="260" height="105" rx="22" fill="#0d1837" stroke="#8aa8ff" stroke-width="3"/>
    <text x="710" y="385" text-anchor="middle" font-size="25" font-weight="700" fill="#d8e1ff">6.21371 miles</text>
    <text x="710" y="422" text-anchor="middle" font-size="20" fill="#ffffff" opacity=".8">DISTANCE</text>
    <rect x="885" y="340" width="180" height="105" rx="22" fill="#ffffff" fill-opacity=".1" stroke="#c799ff" stroke-width="3"/>
    <text x="975" y="385" text-anchor="middle" font-size="28" font-weight="800" fill="#ffffff">⇄</text>
    <text x="975" y="422" text-anchor="middle" font-size="20" fill="#ffffff" opacity=".8">115 UNITS</text>
  </g>
  <text x="600" y="535" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity=".92">Length • Mass • Energy • Speed • Data • And more</text>
  <text x="600" y="580" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" fill="#cbd6ff">English • Hrvatski • Deutsch • Italiano • Español</text>
</svg>