<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Emoji Copy &amp; Paste</title>
  <desc id="desc">Colorful preview for the Emoji Copy &amp; Paste web app.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17112f"/>
      <stop offset="0.52" stop-color="#4d38b5"/>
      <stop offset="1" stop-color="#d42f78"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="20%" r="80%">
      <stop offset="0" stop-color="#ffe16b" stop-opacity=".34"/>
      <stop offset="1" stop-color="#ffe16b" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#080514" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="1200" height="630" rx="34" fill="url(#bg)"/>
  <rect width="1200" height="630" rx="34" fill="url(#glow)"/>
  <circle cx="105" cy="92" r="10" fill="#ffd84b"/>
  <circle cx="1090" cy="510" r="14" fill="#8de4ff" opacity=".75"/>
  <circle cx="1025" cy="98" r="7" fill="#ff8eb9"/>
  <text x="600" y="110" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="6" fill="#dcd6ff">FREE ONLINE APP</text>
  <text x="600" y="230" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="850" letter-spacing="-3" fill="#ffffff">Emoji Copy &amp; Paste</text>
  <text x="600" y="298" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" fill="#e8e3ff">Find meanings • Copy instantly • Use anywhere</text>
  <g filter="url(#shadow)" font-family="Apple Color Emoji,Segoe UI Emoji,Noto Color Emoji,sans-serif" font-size="78">
    <text x="150" y="445">😀</text>
    <text x="285" y="445">😍</text>
    <text x="420" y="445">👋</text>
    <text x="555" y="445">🐶</text>
    <text x="690" y="445">🍕</text>
    <text x="825" y="445">🎮</text>
    <text x="960" y="445">❤️</text>
  </g>
  <text x="600" y="555" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#ffffff" opacity=".9">English • Hrvatski • Deutsch • Italiano • Español</text>
</svg>